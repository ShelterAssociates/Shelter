# nginx site for UAT (uat., uat-report., uat-graphs.shelter-associates.org).
# Installed as /etc/nginx/sites-enabled/shelter_nginx by deploy/nginx/install.sh.
# deploy/nginx/prod.conf is this file with PROD's hostnames and certificate path;
# shelter/test_nginx_config.py fails if the two differ in anything else.
#
# Not in this file: TLS protocols/ciphers (nginx.conf + certbot's
# options-ssl-nginx.conf, deploy/harden_nginx_tls.sh) and server_tokens /
# Server header (nginx.conf, deploy/harden_nginx_headers.sh).
# Every server includes the generic error pages; a "return" must sit inside
# "location /", or nginx shows its own page (which names nginx).
# Every 443 server includes options-ssl-nginx.conf: nginx 1.4.6 crashes (signal 11)
# when SNI switches between servers with and without a shared session cache.

upstream shelter_app {
    server 127.0.0.1:8011 fail_timeout=10;
}

# Requests for a hostname that is not one of ours (Host: attacker.com) get no
# answer at all, instead of falling through to the first site.
server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/snippets/shelter-error-pages.conf;  # deploy/nginx/error-pages.conf
    location / {
        return 444;
    }
}

server {
    listen 443 default_server;
    server_name _;
    ssl on;
    ssl_certificate /etc/letsencrypt/live/uat.shelter-associates.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat.shelter-associates.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # same TLS settings and session cache on every 443 server
    include /etc/nginx/snippets/shelter-error-pages.conf;  # deploy/nginx/error-pages.conf
    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name uat.shelter-associates.org;
    access_log  /var/log/nginx/shelter.access.log;
    error_log   /var/log/nginx/shelter.error.log;

    # Support bigger headers. Useful for huge cookies
    large_client_header_buffers 8 16k;

    client_max_body_size 4G;
    include /etc/nginx/snippets/shelter-error-pages.conf;  # deploy/nginx/error-pages.conf
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    server_name uat.shelter-associates.org;
    listen 443;
    # Nothing is served from nginx's default folder (Ubuntu's "Welcome to nginx!" page).
    root /nonexistent;

    ssl on;
    ssl_certificate /etc/letsencrypt/live/uat.shelter-associates.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/uat.shelter-associates.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000";
    add_header X-Content-Type-Options nosniff;

    include /etc/nginx/snippets/shelter-error-pages.conf;  # deploy/nginx/error-pages.conf

    location /static {
        alias /srv/static_collected/;
    }

    # Media subtrees holding PII are never served by URL; each has a
    # login-checked Django view instead (photos/, avni_console/).
    location /media/photo_exports {
        deny all;
        return 403;
    }

    location /media/shelter/attachments {
        deny all;
        return 403;
    }

    location /media/avni_bulk_updates {
        deny all;
        return 403;
    }

    location /media/job_reports {
        deny all;
        return 403;
    }

    # Slum merge dumps (survey/views.py dump_dir) hold every moved household row.
    location /media/slum_merges {
        deny all;
        return 403;
    }

    location /media/sponsor_project {
        deny all;
        return 403;
    }

    # Household factsheet ZIPs and emailed GIS/RIM exports hold PII: served only
    # by login-checked Django views.
    location /media/FFReport {
        deny all;
        return 403;
    }

    location /media/gis_exports {
        deny all;
        return 403;
    }

    location /media/rim_exports {
        deny all;
        return 403;
    }

    location ~ ^/media/[^/]+\.zip$ {
        deny all;
        return 403;
    }

    # Uploads are never served as a type the browser would execute.
    location ~* ^/media/.*\.(html?|xhtml|shtml|svgz?|xml|xsl|js|mjs|php\d?|phtml|jsp|aspx?|swf)$ {
        deny all;
        return 403;
    }

    location /media {
        alias /srv/media/;
    }

    client_max_body_size 4G;

    location / {
        # checks for static file, if not found proxy to app
        try_files $uri @proxy_to_app;
        proxy_read_timeout 3000;
        proxy_connect_timeout 3000;
        proxy_send_timeout 3000;
    }

    location @proxy_to_app {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;

        proxy_pass http://shelter_app;
    }
}

upstream birt_report {
    server 127.0.0.1:8080 fail_timeout=0;
}

server {
    listen 80;
    server_name uat-report.shelter-associates.org;
    access_log  /var/log/nginx/birt_report.access.log;
    error_log   /var/log/nginx/birt_report.error.log;

    large_client_header_buffers 8 16k;

    client_max_body_size 4G;
    include /etc/nginx/snippets/shelter-error-pages.conf;  # deploy/nginx/error-pages.conf
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    server_name uat-report.shelter-associates.org;
    listen 443;
    # Nothing is served from nginx's default folder (Ubuntu's "Welcome to nginx!" page).
    root /nonexistent;

