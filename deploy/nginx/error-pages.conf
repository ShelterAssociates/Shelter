# Pages nginx itself produces (errors, redirects, plain HTTP on the HTTPS port)
# name no server software. Include in every server block; that block's
# "return" must sit inside a location, or nginx falls back to its default page.
# Installed as /etc/nginx/snippets/shelter-error-pages.conf by deploy/harden_nginx_headers.sh.
error_page 301 400 403 404 405 408 413 414 500 502 503 504 /__error;
# nginx-only codes (header too large, client cert, plain HTTP on 443) as a standard 400.
error_page 494 495 496 497 =400 /__error;
location = /__error {
    internal;
    default_type text/html;
    return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Not available</title></head><body><p>This page is not available.</p></body></html>';
}
