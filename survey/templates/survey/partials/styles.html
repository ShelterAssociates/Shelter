{% comment %}Slum data versions page. Console design system (ph-*/ac-*) plus sv-* additions.{% endcomment %}
{% include "avni_console/partials/styles.html" %}
<style>
  .sv-two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 900px) { .sv-two { grid-template-columns: 1fr; } }

  .sv-search { position: relative; }
  .sv-results { margin-top: 10px; max-height: 320px; overflow-y: auto; border: 1px solid var(--ph-line);
                border-radius: var(--ph-r-sm); display: none; }
  .sv-results.is-open { display: block; }
  .sv-row { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
            padding: 9px 12px; border-bottom: 1px solid var(--ph-line); font-size: 13.5px; }
  .sv-row:last-child { border-bottom: 0; }
  .sv-row:hover, .sv-row.is-active, .sv-row:focus { background: var(--ph-accent-soft); outline: none; }
  .sv-row-name { font-weight: 650; color: var(--ph-ink); }
  .sv-row-path { display: block; font-size: 12px; color: var(--ph-muted); margin-top: 2px; }
  .sv-row-tags { float: right; }
  .sv-empty { padding: 12px; font-size: 13px; color: var(--ph-muted); }
  .sv-hint { font-size: 12.5px; color: var(--ph-muted); margin: 8px 0 0; }

  .sv-tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 650;
            border: 1px solid var(--ph-line); margin-left: 4px; }
  .sv-tag--v { background: var(--ph-accent-soft); color: var(--ph-accent-dark); border-color: #c7d2fe; }
  .sv-tag--wait { background: var(--ph-amber-soft); color: var(--ph-amber); border-color: #fde68a; }
  .sv-tag--loc { background: var(--ph-green-soft); color: var(--ph-green); border-color: #a7f3d0; }

  .sv-recent { display: flex; flex-direction: column; gap: 6px; }
  .sv-recent .sv-row { border: 1px solid var(--ph-line); border-radius: var(--ph-r-sm); }
</style>
